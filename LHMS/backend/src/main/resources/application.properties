# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/lecture_hall
spring.datasource.username=postgres
spring.datasource.password=Praveen@Postgre5005
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Server Configuration
server.port=8088

# JWT Secret Key (generate a strong secret in production)
jwt.secret=yourSuperSecretKeyForJWTEncryption12345
jwt.expiration=86400000


# CORS Configuration for React frontend
cors.allowed-origins=http://localhost:3000
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true